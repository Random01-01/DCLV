# Template rendered by docker-compose before Coturn starts.
# Keep placeholders free of shell syntax: the container replaces them with .env values.
listening-port=__TURN_PORT__
tls-listening-port=__TURN_TLS_PORT__
listening-ip=0.0.0.0
relay-ip=0.0.0.0
realm=__TURN_REALM__
stale-nonce=600
use-auth-secret
static-auth-secret=__TURN_SECRET__
no-cli
no-tlsv1
no-tlsv1_1
fingerprint
log-file=stdout
simple-log
min-port=__TURN_MIN_PORT__
max-port=__TURN_MAX_PORT__
